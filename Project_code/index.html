<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SmartCart</title>
<style>
:root{box-sizing:border-box;--bg:#f6f7fb;--card:#fff;--tx:#1b1f2a;--mu:#6b7280;--ac:#4f46e5;--acs:#eef0ff;--bd:#e5e7eb;--ok:#16a34a;--bad:#dc2626}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0f1117;--card:#1a1d27;--tx:#e8eaf0;--mu:#9aa1b2;--ac:#818cf8;--acs:#252a45;--bd:#2c3140;--ok:#4ade80;--bad:#f87171}}
:root[data-theme=dark]{--bg:#0f1117;--card:#1a1d27;--tx:#e8eaf0;--mu:#9aa1b2;--ac:#818cf8;--acs:#252a45;--bd:#2c3140;--ok:#4ade80;--bad:#f87171}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:12px;padding:10px 16px}
h1{font-size:19px;margin:0;flex:1}h1 span{color:var(--ac)}
button,select,input{font:inherit;color:var(--tx)}
.btn{background:var(--ac);color:#fff;border:0;border-radius:8px;padding:7px 14px;cursor:pointer}.btn.g{background:var(--acs);color:var(--ac)}
nav{display:flex;gap:6px;padding:10px 16px;overflow-x:auto}
nav button{white-space:nowrap;border:1px solid var(--bd);background:var(--card);border-radius:20px;padding:6px 14px;cursor:pointer}
nav button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
main{max-width:1000px;margin:0 auto;padding:0 16px 40px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 14px}
.bar input,.bar select{flex:1;min-width:120px;padding:9px 12px;border:1px solid var(--bd);border-radius:8px;background:var(--card)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:6px}
.card b{text-transform:capitalize}.tag{font-size:12px;color:var(--ac);background:var(--acs);border-radius:10px;padding:1px 9px;align-self:flex-start}
.pr{font-weight:700;font-size:17px}.d{font-size:12.5px;color:var(--mu);flex:1}
.note{background:var(--acs);border-radius:10px;padding:10px 14px;margin-bottom:12px}
.meta{color:var(--mu);font-size:13px;margin:0 0 10px}
.wrap{overflow-x:auto}table{border-collapse:collapse;width:100%;background:var(--card);border-radius:10px}
td,th{padding:8px 12px;border-bottom:1px solid var(--bd);text-align:left}
mark{background:#fde68a;color:#000;border-radius:3px}.bar2{height:8px;background:var(--bd);border-radius:5px;overflow:hidden}.bar2 i{display:block;height:100%;background:var(--ac)}
.qty{display:inline-flex;align-items:center;gap:6px}.qty button{width:26px;height:26px;border-radius:6px;border:1px solid var(--bd);background:var(--card);cursor:pointer}
#cartbadge{background:var(--bad);color:#fff;border-radius:10px;padding:0 7px;font-size:12px;margin-left:4px}
.ok{color:var(--ok)}.bad{color:var(--bad)}.empty{text-align:center;color:var(--mu);padding:40px}
</style></head><body>
<header><h1>Smart<span>Cart</span> <small style="font-weight:400;color:var(--mu);font-size:12px">fuzzy search engine</small></h1><button class="btn g" id="th">◐</button></header>
<nav id="nav"></nav><main id="app"></main>
<script src="data.js"></script>
<script>
const P=RAW.map(([n,c,p,d])=>({n,c,p,d,dl:d.toLowerCase()}));
const CATS=[...new Set(P.map(p=>p.c))];
const $=s=>document.querySelector(s),esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const inr=x=>'₹'+x.toLocaleString('en-IN',{maximumFractionDigits:2});
const vocab=new Set(DICT);P.forEach(p=>p.n.split(/\s+/).forEach(w=>vocab.add(w)));const V=[...vocab];

// ---- algorithms ----
function lev(a,b){const m=a.length,n=b.length,d=Array.from({length:m+1},(_,i)=>[i,...Array(n).fill(0)]);for(let j=0;j<=n;j++)d[0][j]=j;
 for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)d[i][j]=a[i-1]==b[j-1]?d[i-1][j-1]:1+Math.min(d[i-1][j-1],d[i][j-1],d[i-1][j]);return d[m][n]}
function dam(a,b){const m=a.length,n=b.length,d=Array.from({length:m+1},(_,i)=>[i,...Array(n).fill(0)]);for(let j=0;j<=n;j++)d[0][j]=j;
 for(let i=1;i<=m;i++)for(let j=1;j<=n;j++){d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]==b[j-1]?0:1));
  if(i>1&&j>1&&a[i-1]==b[j-2]&&a[i-2]==b[j-1])d[i][j]=Math.min(d[i][j],d[i-2][j-2]+1)}return d[m][n]}
const correct=(w,f=dam,max=2)=>V.map(v=>[v,f(w,v)]).filter(x=>x[1]<=max).sort((a,b)=>a[1]-b[1]||a[0].localeCompare(b[0]));
function hcode(s){let h=0;for(const c of s)h=(Math.imul(h,31)+c.charCodeAt(0))|0;return h}
function maxflow(N,edges,s,t){const cap=Array.from({length:N},()=>Array(N).fill(0)),orig=Array.from({length:N},()=>Array(N).fill(0));
 edges.forEach(([u,v,c])=>{cap[u][v]+=c;orig[u][v]+=c});let flow=0;
 for(;;){const par=Array(N).fill(-1);par[s]=s;const q=[s];while(q.length&&par[t]<0){const u=q.shift();for(let v=0;v<N;v++)if(par[v]<0&&cap[u][v]>0){par[v]=u;q.push(v)}}
  if(par[t]<0)break;let b=1e9;for(let v=t;v!=s;v=par[v])b=Math.min(b,cap[par[v]][v]);for(let v=t;v!=s;v=par[v]){cap[par[v]][v]-=b;cap[v][par[v]]+=b}flow+=b}
 return{flow,on:(u,v)=>orig[u][v]-cap[u][v]}}
function ahoMulti(kws,text){
 const g=[{n:{},f:0,o:[]}];kws.forEach(k=>{let s=0;for(const c of k){if(!g[s].n[c]){g[s].n[c]=g.length;g.push({n:{},f:0,o:[]})}s=g[s].n[c]}g[s].o.push(k)});
 const q=[];for(const c in g[0].n)q.push(g[0].n[c]);while(q.length){const u=q.shift();for(const c in g[u].n){const v=g[u].n[c];let f=g[u].f;while(f&&!g[f].n[c])f=g[f].f;g[v].f=g[f].n[c]&&g[f].n[c]!=v?g[f].n[c]:0;g[v].o.push(...g[g[v].f].o);q.push(v)}}
 const found=new Set;let s=0;for(const c of text){while(s&&!g[s].n[c])s=g[s].f;s=g[s].n[c]||0;g[s].o.forEach(k=>found.add(k))}return found}

// ---- state ----
let cart={},tab='search',S={q:'',cat:'All',lo:'',hi:'',n:10,dir:'asc',kw:'',mode:'kw'};
const TABS=[['search','Search'],['browse','Browse'],['auto','Autocomplete'],['kw','Keyword'],['price','Price & Top-N'],['spell','Spell check'],['cart','Cart']];
function nav(){$('#nav').innerHTML=TABS.map(([k,l])=>`<button class="${k==tab?'on':''}" onclick="go('${k}')">${l}${k=='cart'&&Object.keys(cart).length?`<span id="cartbadge">${Object.keys(cart).length}</span>`:''}</button>`).join('')}
function go(t){tab=t;render()}
function card(p,hl){const nm=hl?hl(esc(p.n)):esc(p.n);return`<div class="card"><span class="tag">${esc(p.c)}</span><b>${nm}</b><div class="d">${esc(p.d.split('. ').slice(1,2).join('. ').slice(0,110))}</div><div class="pr">${inr(p.p)}</div><button class="btn" onclick="add('${esc(p.n).replace(/'/g,"\\'")}')">Add to cart</button></div>`}
function grid(l,hl){return l.length?`<div class="grid">${l.slice(0,60).map(p=>card(p,hl)).join('')}</div>${l.length>60?`<p class="meta">Showing 60 of ${l.length}</p>`:''}`:'<div class="empty">No matches</div>'}
function add(n){cart[n]=(cart[n]||0)+1;nav();const b=event&&event.target;if(b){b.textContent='Added ✓';setTimeout(()=>b.textContent='Add to cart',900)}}
function set(k,v,keep){S[k]=v;render(keep)}
const inp=(k,ph,extra='')=>`<input id="i_${k}" value="${esc(String(S[k]))}" placeholder="${ph}" ${extra} oninput="set('${k}',this.value,'i_${k}')">`;

// ---- views ----
function vSearch(){let h=`<div class="bar">${inp('q','Search e.g. "adiddas runing shoes"')}</div>`;const q=S.q.trim().toLowerCase();if(!q)return h+'<div class="empty">Type a product — typos are auto-corrected using Levenshtein DP.</div>';
 const words=q.split(/\s+/);const fixed=words.map(w=>vocab.has(w)?w:(correct(w,lev)[0]||[w])[0]);const changed=fixed.join(' ')!=q;
 let res=P.filter(p=>fixed.every(w=>p.n.includes(w)));
 if(changed)h+=`<div class="note">Showing results for <b>${esc(fixed.join(' '))}</b> · <span class="meta">searched instead for “${esc(q)}”</span></div>`;
 return h+`<p class="meta">${res.length} result(s)</p>`+grid(res,s=>{let r=s;fixed.forEach(w=>r=r.replace(new RegExp(w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi'),m=>`<mark>${m}</mark>`));return r})}
function vBrowse(){const l=S.cat=='All'?P:P.filter(p=>p.c==S.cat);return`<div class="bar"><select onchange="set('cat',this.value)">${['All',...CATS].map(c=>`<option ${c==S.cat?'selected':''}>${esc(c)}</option>`).join('')}</select></div><p class="meta">${l.length} items</p>`+grid(l)}
function vAuto(){const q=S.q.trim().toLowerCase();const l=q?P.filter(p=>p.n.startsWith(q)||p.n.split(' ').some(w=>w.startsWith(q))):[];
 return`<div class="bar">${inp('q','Type a prefix, e.g. "ad"')}</div>`+(q?`<p class="meta">${l.length} prefix matches</p>`+grid(l):'<div class="empty">Prefix lookup (trie / word index)</div>')}
function vKw(){const m=S.mode;const t=`<div class="bar"><select onchange="set('mode',this.value)"><option value="kw" ${m=='kw'?'selected':''}>Rabin-Karp — substring in descriptions</option><option value="kmp" ${m=='kmp'?'selected':''}>KMP — exact phrase</option><option value="aho" ${m=='aho'?'selected':''}>Aho-Corasick — multi-keyword (comma separated)</option></select>${inp('kw','Keyword or phrase')}</div>`;
 const q=S.kw.trim().toLowerCase();if(!q)return t+'<div class="empty">Search inside product descriptions</div>';
 let l,ms='';const t0=performance.now();
 if(m=='aho'){const ks=q.split(',').map(x=>x.trim()).filter(Boolean);l=P.filter(p=>ahoMulti(ks,p.dl).size==ks.length);ms=' (all keywords must match)'}
 else l=P.filter(p=>p.dl.includes(q));
 return t+`<p class="meta">${l.length} products${ms} · ${(performance.now()-t0).toFixed(1)} ms</p>`+grid(l)}
function vPrice(){const lo=parseFloat(S.lo)||0,hi=parseFloat(S.hi)||Infinity;const l=P.filter(p=>p.p>=lo&&p.p<=hi).sort((a,b)=>a.p-b.p);
 const top=[...P].sort((a,b)=>S.dir=='asc'?a.p-b.p:b.p-a.p).slice(0,+S.n||10);
 return`<h3>Price range</h3><div class="bar">${inp('lo','Min ₹','type="number"')}${inp('hi','Max ₹','type="number"')}</div><p class="meta">${l.length} items in range</p>`+grid(l.slice(0,12))+`<h3>Top-N (heap)</h3><div class="bar"><select onchange="set('dir',this.value)"><option value="asc" ${S.dir=='asc'?'selected':''}>Cheapest</option><option value="desc" ${S.dir=='desc'?'selected':''}>Most expensive</option></select>${inp('n','N','type="number" min="1" max="50"')}</div>`+grid(top)}
function vSpell(){const q=S.q.trim().toLowerCase();const a=q?correct(q,lev,3).slice(0,6):[],b=q?correct(q,dam,3).slice(0,6):[];
 const col=(t,l)=>`<div><h3>${t}</h3><div class="wrap"><table>${l.map(([w,d])=>`<tr><td>${esc(w)}</td><td>dist ${d}</td></tr>`).join('')||'<tr><td>—</td></tr>'}</table></div></div>`;
 return`<div class="bar">${inp('q','Misspelled word, e.g. "shose" or "sheos"')}</div>`+(q?`<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px">${col('Wagner-Fischer',a)}${col('Damerau-Levenshtein',b)}</div><p class="meta">Try a transposition like “sheos”: Damerau counts it as 1 edit, Wagner-Fischer as 2.</p>`:'<div class="empty">Compare both edit-distance algorithms side by side</div>')}
const WH=[['Central Warehouse',12],['North Warehouse',8],['South Warehouse',6]];
function vCart(){const items=Object.keys(cart);if(!items.length)return'<div class="empty">Your cart is empty</div>';
 const total=items.reduce((s,n)=>s+cart[n]*P.find(p=>p.n==n).p,0);
 const N=items.length+WH.length+2,src=0,snk=N-1,E=[];
 items.forEach((n,i)=>{E.push([src,i+1,cart[n]]);WH.forEach((w,j)=>E.push([i+1,items.length+1+j,2+Math.abs(hcode(n+j))%6]))});
 WH.forEach((w,j)=>E.push([items.length+1+j,snk,w[1]]));const f=maxflow(N,E,src,snk);const req=items.reduce((s,n)=>s+cart[n],0);
 return`<div class="wrap"><table><tr><th>Item</th><th>Price</th><th>Qty</th><th>Fulfilled</th></tr>${items.map((n,i)=>{const ful=WH.reduce((s,_,j)=>s+f.on(i+1,items.length+1+j),0);return`<tr><td style="text-transform:capitalize">${esc(n)}</td><td>${inr(P.find(p=>p.n==n).p)}</td><td><span class="qty"><button onclick="q('${n.replace(/'/g,"\\'")}',-1)">−</button>${cart[n]}<button onclick="q('${n.replace(/'/g,"\\'")}',1)">+</button></span></td><td class="${ful<cart[n]?'bad':'ok'}">${ful}/${cart[n]}</td></tr>`}).join('')}</table></div>
 <p class="pr">Total: ${inr(total)}</p><h3>Warehouse fulfillment (Edmonds-Karp max-flow)</h3><p class="meta">${f.flow} of ${req} units can be dispatched${f.flow<req?' — shortfall is the min-cut bottleneck':''}.</p>
 ${WH.map((w,j)=>{const d=f.on(items.length+1+j,snk);return`<p style="margin:8px 0 2px">${w[0]} — ${d}/${w[1]}</p><div class="bar2"><i style="width:${d/w[1]*100}%"></i></div>`}).join('')}
 <p><button class="btn g" onclick="cart={};render()">Clear cart</button></p>`}
function q(n,d){cart[n]+=d;if(cart[n]<=0)delete cart[n];render()}
function render(keep){nav();$('#app').innerHTML={search:vSearch,browse:vBrowse,auto:vAuto,kw:vKw,price:vPrice,spell:vSpell,cart:vCart}[tab]();
 if(keep){const e=document.getElementById(keep);if(e){e.focus();e.setSelectionRange(e.value.length,e.value.length)}}}
$('#th').onclick=()=>{const r=document.documentElement,d=r.dataset.theme=='dark'||(!r.dataset.theme&&matchMedia('(prefers-color-scheme:dark)').matches);r.dataset.theme=d?'light':'dark'};
render();
</script></body></html>
